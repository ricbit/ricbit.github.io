    <style>

<body>
    <div id="wmsx">

    <script src="wmsx.js"></script>
    <script>
        // Parameters must be set after wmsx.js is loaded (WebMSX docs).
        // g9.json: MSX1 (NTSC) with the Expert BIOS, V9990 cartridge, VSync off,

        WMSX.CONFIG_URL = "g9.json";
    </script>
